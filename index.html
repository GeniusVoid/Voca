<style>

.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 10px 6px 16px;min-height:56px;border-bottom:var(--bw) solid var(--ink)}

.em{text-align:center;color:var(--mut);padding:28px 10px}.em .b{margin-top:12px;color:var(--ink)}

.tk{height:14px;border:var(--bw) solid var(--ink);border-radius:99px;background:var(--bs);margin:12px 0 6px;overflow:hidden}.tk i{display:block;height:100%;background:var(--blue)}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 18px;padding:0 16px 8px}
.sc{flex:0 0 84%;scroll-snap-align:start;margin:0 0 6px}.sc .b{width:100%;margin-top:12px;border-radius:99px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}

.rv{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:1px solid var(--mut)}

.lab{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--red)}

.ch{transition:transform .2s}.ch.op{transform:rotate(180deg)}
.tag{font-size:12px;font-weight:800;background:var(--bs);color:var(--blue);border:var(--bw) solid var(--blue);border-radius:99px;padding:0 8px}
.row2{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.ok{color:var(--grn)}.no{color:var(--red)}
.bd{position:fixed;inset:0;background:var(--dim);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.bd.sh{align-items:flex-end;padding:0}
.pp{width:100%;max-width:420px;max-height:86dvh;overflow:auto;background:var(--sf);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:16px;animation:fi .18s}
.sh .pp{max-width:560px;border-radius:var(--r) var(--r) 0 0;min-height:42dvh;animation:up .25s;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(100%)}}
.ac{display:flex;gap:10px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
.mh{display:flex;align-items:center;justify-content:space-between}
.dimb{opacity:.45}
.rw2{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--mut)}
.tg{width:54px;height:30px;border:var(--bw) solid var(--ink);border-radius:99px;background:var(--bs);position:relative;cursor:pointer;padding:0}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .2s}
.tg.on{background:var(--grn)}.tg.on i{transform:translateX(24px);background:var(--on)}
.rd{border:var(--bw) solid var(--ink);border-radius:50%;width:44px}.rd.spin svg{animation:sp .5s}
.sp{width:46px;height:46px;border:5px solid var(--bs);border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}
#nt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.nt{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:520px;width:100%;padding:8px 12px;background:var(--sf);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);font-size:13px;font-weight:600;animation:fi .2s}
.nt.error{color:var(--red);border-color:var(--red)}.nt.ok{color:var(--grn)}.nt span{flex:1}
.q{display:flex;flex-direction:column;height:100%}
.pb{position:relative;height:32px;margin:6px 30px 12px}
.pb .tr{position:absolute;left:0;right:0;top:11px;height:10px;margin:0}
.ci{position:absolute;top:50%;transform:translate(-50%,-50%);height:24px;min-width:24px;padding:0 5px;border-radius:99px;background:var(--sf);border:var(--bw) solid var(--ink);display:grid;place-items:center;font-size:11px;font-weight:800;z-index:2}
.ci.r{left:0;color:var(--red)}.ci.b{left:100%;color:var(--blue)}.ci.g{color:var(--grn);z-index:1;transition:left .45s ease;background:var(--gs)}
.qb{display:flex;justify-content:space-between;gap:10px;padding:12px 16px;border-top:var(--bw) solid var(--ink);background:var(--sf)}
.qb .b{flex:0 1 46%;min-width:110px}
.qq{font-size:20px;font-weight:700;margin-bottom:16px}
.op{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:52px;padding:10px 14px;margin-bottom:10px;border:var(--bw) solid var(--ink);border-radius:var(--r);background:var(--sf);color:var(--ink);font:inherit;text-align:left;box-shadow:var(--sh);cursor:pointer}
.op.ok{background:var(--gs);color:var(--grn);border-color:var(--grn)}.op.no{background:var(--rs);color:var(--red);border-color:var(--red)}.op.dm{opacity:.45;box-shadow:none}
.vd{display:flex;align-items:center;gap:6px;font-weight:800;margin:6px 0 10px}
.bl{display:inline-block;min-width:90px;border-bottom:4px solid var(--ink);margin:0 4px;vertical-align:baseline;font-weight:800}.bl.f{border-color:currentColor}
.fc{position:relative;min-height:240px;perspective:900px;cursor:pointer}
.ff{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:18px;background:var(--sf);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);overflow:auto;backface-visibility:hidden;transition:transform .5s}
.ff p{font-size:20px;font-weight:700;margin:6px 0 0}.ff.bk{transform:rotateX(180deg);background:var(--bs)}
.fc.fl .ff{transform:rotateX(180deg)}.fc.fl .ff.bk{transform:none}
.hint{text-align:center;color:var(--mut);font-size:13px;margin-top:12px}
.st{display:flex;justify-content:space-around;margin:16px 0}.st b{display:block;font-size:28px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div id="app"></div><div id="md"></div><div id="nt"></div>
<script>
const VER="0.0.3",$=s=>document.querySelector(s),now=()=>Date.now(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ID=()=>{let s="";for(let i=0;i<10;i++)s+="abcdefghijklmnopqrstuvwxyz0123456789"[Math.random()*36|0];return s};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const spread=q=>{for(let i=1;i<q.length;i++)if(q[i].split(":")[0]===q[i-1].split(":")[0]){const j=q.findIndex((x,k)=>k>i&&x.split(":")[0]!==q[i-1].split(":")[0]);if(j>0)[q[i],q[j]]=[q[j],q[i]]}return q};
const hash=c=>{let h=5381;const s=c.f+"\u0001"+c.b;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h};
/* icons: registry, set_1 */
const IC={set_1:{home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',add:'<path d="M12 5v14M5 12h14"/>',library:'<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="16" rx="1"/><path d="M17 6l3.6-1 2 14-3.6 1z"/>',learn:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/>',settings:'<path d="M3 8h3M12 8h9M3 16h9M18 16h3"/><circle cx="9" cy="8" r="3"/><circle cx="15" cy="16" r="3"/>',back:'<path d="M15 5l-7 7 7 7"/>',cross:'<path d="M6 6l12 12M18 6L6 18"/>',chevron:'<path d="M6 9l6 6 6-6"/>',deck:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',card:'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 10h8M8 14h5"/>',error:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',retry:'<path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v5h-5"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',dots:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',list:'<path d="M4 6h16M4 12h16M4 18h10"/>'}};
const ic=(n,z=22)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(IC[S.set.icons]||IC.set_1)[n]||""}</svg>`;
/* storage */
const DEF=()=>({sv:1,decks:{},cards:{},qs:{},items:{},rt:[],ses:{},set:{base:"",key:"",model:"",st:"",mcq:true,fill:false,fc:false,shuf:false,icons:"set_1",cp:false,cpm:false,prompt:""},ui:{tab:"home",lib:"primary",exp:{},at:"deck",hf:"mcq",d:{dl:"primary::",dn:"",cf:"",cb:""}}});
let S=DEF(),memOnly=false,V={sc:{},quiz:null,sub:null,fin:null,typed:"",more:0},G={pending:new Set(),run:0,stop:0,qt:null},warned=false,st=null;
try{const j=localStorage.getItem("voca");if(j){const o=JSON.parse(j),d=DEF();S={...d,...o,set:{...d.set,...o.set},ui:{...d.ui,...o.ui,d:{...d.ui.d,...(o.ui&&o.ui.d)}}}}}catch(e){memOnly=true}
function save(){try{localStorage.setItem("voca",JSON.stringify(S))}catch(e){if(!warned){warned=true;note("Could not save. Storage may be full or blocked, so changes may be lost.","error")}}}
const saveSoon=()=>{clearTimeout(st);st=setTimeout(save,400)};
/* data helpers */
const kids=p=>Object.values(S.decks).filter(d=>d.p===p).sort((a,b)=>a.n.localeCompare(b.n));
const dcards=id=>Object.values(S.cards).filter(c=>c.d===id);
function allCards(id){let r=dcards(id);kids(id).forEach(k=>r=r.concat(allCards(k.id)));return r}
const path=id=>{const a=[];while(id&&id!=="primary"&&S.decks[id]){a.unshift(S.decks[id].n);id=S.decks[id].p}return "primary"+a.map(x=>"::"+x).join("")};
function resolve(s){const p=s.split("::").map(x=>x.trim()).filter(Boolean);if(p[0]!=="primary")return null;let id="primary";for(const n of p.slice(1)){const k=kids(id).find(d=>d.n.toLowerCase()===n.toLowerCase());if(!k)return null;id=k.id}return id}
const tree=(p="primary",dep=0)=>kids(p).flatMap(d=>[{id:d.id,dep},...tree(d.id,dep+1)]);
const isDesc=(x,anc)=>{while(x&&x!=="primary"){if(x===anc)return true;x=S.decks[x]&&S.decks[x].p}return false};
function nameErr(n,p,self){n=n.trim();if(!n)return "Type a deck name.";if(n.length>60)return "Name can’t be longer than 60 characters.";if(n.includes("::"))return "Name can’t contain “::”.";if(kids(p).some(d=>d.id!==self&&d.n.toLowerCase()===n.toLowerCase()))return "A deck with that name already exists there.";return ""}
function delCard(id){delete S.cards[id];["mcq","fill_up","flashcard"].forEach(t=>{delete S.qs[id+":"+t];delete S.items[id+":"+t]});S.rt=S.rt.filter(r=>r.card!==id);for(const k in S.ses){const s=S.ses[k];s.queue=s.queue.filter(i=>i.split(":")[0]!==id);for(const i in s.res)if(i.split(":")[0]===id)delete s.res[i];if(!Object.keys(s.res).length)delete S.ses[k]}}
function delDeck(id){const ids=[id,...tree(id).map(t=>t.id)];ids.forEach(d=>{dcards(d).forEach(c=>delCard(c.id));delete S.ses[d];delete S.decks[d]})}
/* notifications + modal */
const NT=[],safe=e=>String(e&&e.message||e).split(S.set.key||"\u0000").join("•••");
function note(t,k="info",act){const n={id:ID(),t:String(t),k,act};NT.push(n);while(NT.length>3)NT.shift();drawN();setTimeout(()=>{if(!V.more)dropN(n.id)},6000)}
function dropN(id){const i=NT.findIndex(n=>n.id===id);if(i>=0)NT.splice(i,1);drawN()}
function drawN(){$("#nt").innerHTML=NT.map(n=>{const lg=n.k==="error"&&n.t.length>44;return `<div class="nt ${n.k}" data-a="ndrop" data-id="${n.id}">${ic(n.k==="error"?"error":n.k==="ok"?"check":"card",18)}<span>${esc(lg?n.t.slice(0,40)+"…":n.t)}</span>${lg?`<button class="b g sm" data-a="nmore" data-id="${n.id}">More</button>`:""}${n.act?`<button class="b g sm" data-a="nact" data-id="${n.id}">${esc(n.act.l)}</button>`:""}</div>`}).join("")}
function modal(h,cls=""){$("#md").innerHTML=`<div class="bd ${cls}"><div class="pp">${h}</div></div>`}
function mclose(){$("#md").innerHTML="";V.more=0;clearInterval(V.lt)}
window.addEventListener("error",e=>note(safe(e.message),"error"));
window.addEventListener("unhandledrejection",e=>note(safe(e.reason),"error"));
/* history: back button never exits from a sub-screen */
const guard=()=>{try{history.pushState({v:1},"")}catch(e){}};
function backNav(){if($("#md").innerHTML){mclose();return true}if(V.quiz){V.quiz=null;V.fin=null;render();return true}if(V.sub){V.sub=null;render();return true}if(S.ui.tab==="library"&&S.ui.lib!=="primary"){const d=S.decks[S.ui.lib];S.ui.lib=d?d.p:"primary";save();render();return true}return false}
addEventListener("popstate",()=>{if(backNav())guard()});
/* ---------- screens ---------- */
const TABS=[["home","Home"],["add","Add"],["library","Library"],["learn","Learn"]];
const TK={mcq:"mcq",fill_up:"fill",flashcard:"fc"},types=()=>["mcq","fill_up","flashcard"].filter(t=>S.set[TK[t]]);
const qTotal=s=>{const R=Object.values(s.res);if(s.kind==="review")return R.length;const cards=new Set(Object.keys(s.res).map(i=>i.split(":")[0]));const active=Math.max(1,types().length);return Math.max(R.length,cards.size*active)};
const shell=b=>`<div class="hd"><b class="lg">Voca</b><button class="ib" aria-label="Settings" data-a="settings">${ic("settings")}</button></div><div id="mn">${b}</div><nav class="nv">${TABS.map(([k,l])=>`<button class="${S.ui.tab===k?"on":""}" aria-label="${l}" data-a="tab" data-k="${k}">${ic(k,24)}</button>`).join("")}</nav>`;
const empty=(t,b,k)=>`<div class="em">${t}<br><button class="b" data-a="tab" data-k="${k}">${b}</button></div>`;
function itemText(i){const c=S.cards[i.c];if(!c)return"";const q=S.qs[i.id];return i.t==="mcq"&&q&&q.q?q.q:i.t==="fill_up"&&q&&q.s?q.s:c.f}
function homeH(){
 const ss=Object.values(S.ses).sort((a,b)=>b.u-a.u);
 let h=`<h1>You Left Here!</h1>`+(ss.length?`<div class="hs">${ss.map(s=>{const R=Object.values(s.res),t=qTotal(s),a=R.filter(r=>r==="correct"||r==="incorrect").length;return `<div class="card sc"><div class="rw"><b class="nm">${esc(s.title)}</b><button class="ib" aria-label="Menu" data-a="smenu" data-id="${s.id}">${ic("dots")}</button></div><div class="tk"><i style="width:${t?a/t*100:0}%"></i></div><small>${a}/${t} cards completed</small><button class="b p" data-a="cont" data-id="${s.id}">Continue</button></div>`}).join("")}</div>`:empty("Nothing left unfinished.","Go to Learn","learn"));

const SYS_BASE=`You turn flashcards into quiz questions.

You receive:
- "cards": flashcards to turn into questions. Each has id, front, back.

 if(S.ses[id])return modal(`<h2>${esc(S.decks[id].n)}</h2><p>You have an unfinished session.</p><div class="ac"><button class="b" data-a="over" data-id="${id}">Start over</button><button class="b p" data-a="cont" data-id="${id}">Resume</button></div>`);
 newSession(id,cs,S.decks[id].n,"deck")}
function ans(ok,x={}){const s=S.ses[V.quiz],it=s&&curItem(s);if(!it||it.wait||(s.cur&&s.cur.ph==="a"))return false;
 if(ok){it.c.cs+=.5;s.dl+=.5}else{it.c.ws-=1;s.dl-=1}
 S.items[it.id]={id:it.id,t:it.id.split(":")[1],c:it.c.id,r:ok?"correct":"incorrect",at:now()};if(it.id in s.res)s.res[it.id]=ok?"correct":"incorrect";
 S.rt=S.rt.filter(r=>r.item!==it.id);s.cur={id:it.id,ph:"a",ok,fl:1,...x};s.u=now();save();render();return true}
function next(){clearTimeout(G.qt);const s=S.ses[V.quiz];if(!s)return;s.queue.shift();s.cur=null;V.typed="";s.u=now();pullRetest(s,false);if(!s.queue.length)finish(s);save();render()}
/* fill-up check */
const cl=s=>s.toLowerCase().replace(/\s+/g,"").replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"");
const lev=(a,b)=>{const d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=t}}return d[b.length]};
const chk=(t,q)=>{const x=cl(t);return[q.ans,...q.alt].some(a=>{const y=cl(a);if(x===y)return true;if(/\d/.test(x+y))return false;const l=y.length;return lev(x,y)<=(l<=3?0:l<=8?1:2)})};

 try{const H=S.set.key?{headers:{Authorization:"Bearer "+S.set.key}}:{};let r=await fetch(base()+"/models",H);if(r.status===404&&/^https?:\/\/[^/]+$/.test(base())){const r2=await fetch(base()+"/v1/models",H);if(r2.ok){S.set.base=base()+"/v1";const bi=$("#ub");if(bi)bi.value=S.set.base;r=r2}}if(!r.ok){const e=new Error("http");e.status=r.status;throw e}
  const j=await r.json();V.models=(j.data||j.models||[]).map(m=>m.id||m.name||m).filter(x=>typeof x==="string").sort();S.set.st="ok";if(!V.models.length)V.manual=true;save();modelBox()}
 catch(e){S.set.st="bad";V.manual=true;save();modelBox();note(errMsg(e),"error")}}

 :`<small>Front</small><p style="font-weight:700;font-size:18px">${esc(c.f)}</p><small>Back</small><p>${esc(c.b)||"(no back)"}</p><div class="ac"><button class="b" data-a="cdel" data-id="${id}">Delete</button><button class="b p" data-a="cedit" data-id="${id}">Edit</button></div>`)}
function parseImp(text,d){const lines=text.split(/\r?\n/).filter(x=>x.trim());if(lines.length&&/^"?front"?\s*[,;\t]\s*"?back"?$/i.test(lines[0].trim()))lines.shift();
 const exist=new Set(dcards(d).map(c=>c.f+"\u0001"+c.b)),rows=[];let sk=0;
 for(const l of lines.slice(0,2000)){let f,b;if(l.includes("\t")){const i=l.indexOf("\t");f=l.slice(0,i);b=l.slice(i+1)}else{const o=[];let cur="",q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else if(ch==='"')q=true;else if(ch===","||ch===";"){o.push(cur);cur=""}else cur+=ch}o.push(cur);f=o[0];b=o.slice(1).join(", ")}
  f=(f||"").trim();b=(b||"").trim();const k=f+"\u0001"+b;if(!f||exist.has(k)){sk++;continue}exist.add(k);rows.push([f,b])}
 return{rows,sk,over:Math.max(0,lines.length-2000)}}
